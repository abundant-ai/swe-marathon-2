[project]
name = "orange-task-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai==1.109.1",
    "torch==2.10.0",
    "transformers==5.4.0",
    "sentence-transformers==5.3.0",
    "peft==0.18.1",
    "pillow==12.1.1",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["../checks"]
