[project]
name = "orange-task-authoring"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pyarrow==23.0.1",
    "logfire>=4,<5",
    "pydantic==2.14.3",
    "harbor[modal] @ git+https://github.com/harbor-framework/harbor.git@feea734de84bf2479b329dc6315a6d98d1596f4f",
    "chromadb==1.5.9",
    "opentelemetry-instrumentation-fastapi==0.65b0",
    "pydantic-ai-slim[openai]==2.68.0",
    "openai==3.49.0",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.pytest.ini_options]
testpaths = ["checks"]
