schema_version = "1.4"
artifacts = ["/app/server"]

[task]
name = "abundant/swe-m2_software-engineering_backoffice-server-rebuild"
description = "Write a replacement server for a running back-office application whose own server is sealed, using only its web client, sample files and its live behaviour."
authors = [{ name = "Neel Harsola", email = "work.neelharsola@gmail.com" }]

[metadata]
reward_type = "continuous"
open_internet_justification = "The environment build, the agent's tool setup and the build of the second image have public egress, to install system and Python packages. The agent works without network access, the sealed server it studies runs inside its own container, and the final check runs without network."

[agent]
timeout_sec = 34560
network_mode = "no-network"
user = "dev"

[[agent.setup_begin]]
command = "/usr/local/sbin/start-stockwell"
timeout_sec = 120

[[agent.setup_complete]]
command = "/usr/local/sbin/start-stockwell"
timeout_sec = 120

[environment]
network_mode = "public"
build_timeout_sec = 1800
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
workdir = "/app"

[verifier]
environment_mode = "separate"
network_mode = "no-network"
timeout_sec = 6000
user = "root"

[[verifier.collect]]
command = "/usr/local/sbin/fsmaint-sweep"
user = "root"
timeout_sec = 600

[verifier.environment]
network_mode = "public"
build_timeout_sec = 1800
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
