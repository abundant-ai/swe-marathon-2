schema_version = "1.4"
artifacts = ["/app/server"]

[task]
name = "abundant/swe-m2_software-engineering_backoffice-server-rebuild"
description = "Write a replacement for the old server of a running back-office application, whose code may not be read, using only its web client, sample files and its live behaviour."
authors = [{ name = "Neel Harsola", email = "work.neelharsola@gmail.com" }]

[metadata]
reward_type = "continuous"

[agent]
timeout_sec = 43200
network_mode = "no-network"
user = "dev"

[[agent.setup_begin]]
command = "/usr/local/sbin/start-stockwell"
timeout_sec = 120

[[agent.setup_complete]]
command = "/usr/local/sbin/start-stockwell"
timeout_sec = 120

[environment]
network_mode = "no-network"
build_timeout_sec = 1800
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
workdir = "/app"

[verifier]
environment_mode = "separate"
network_mode = "no-network"
timeout_sec = 6000
user = "root"

[[verifier.collect]]
command = "/usr/local/sbin/fsmaint-sweep"
user = "root"
timeout_sec = 600

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 1800
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
