schema_version = "1.4"
artifacts = ["/app/rebuild"]

[task]
name = "abundant/swe-m2_software-engineering_basedpl-interpreter-rebuild-no-examples"
description = "Reimplement the interpreter of an array language first published in late 2026 from an execute-only copy of the interpreter and its documentation alone, with no example runs or recorded outputs."
authors = [{ name = "Neel Harsola", email = "work.neelharsola@gmail.com" }]

[metadata]
reward_type = "continuous"
open_internet_justification = "Only the image builds have public egress, to install system packages from Ubuntu's archive: the agent's image, and the separate image that later runs the rebuild. The agent works without network access, and so does that later run of the rebuild."

[agent]
timeout_sec = 34560
network_mode = "no-network"
user = "dev"

[[agent.setup_begin]]
command = "/usr/local/sbin/provision-scratch"
timeout_sec = 120

[[agent.setup_complete]]
command = "/usr/local/sbin/provision-scratch"
timeout_sec = 120

[environment]
network_mode = "public"
build_timeout_sec = 3600
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
workdir = "/app"

[verifier]
environment_mode = "separate"
network_mode = "no-network"
timeout_sec = 4500
user = "root"

[[verifier.collect]]
command = "/usr/local/sbin/reclaim-scratch"
user = "root"
timeout_sec = 600

[verifier.environment]
network_mode = "public"
build_timeout_sec = 3600
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
