schema_version = "1.4"
artifacts = ["/app"]

[task]
name = "abundant/swe-m2_ai-engineering_knowledge-work-assistant"
description = "Build a knowledge-work assistant through successive engineering steps."
authors = [{ name = "Rundong Liu", email = "rundong@abundant.ai" }]

[metadata]
reward_type = "continuous"

[agent]
timeout_sec = 14400
user = "candidate"

[environment]
network_mode = "allowlist"
allowed_hosts = ["api.openai.com"]
build_timeout_sec = 3600
cpus = 4
memory_mb = 32768
storage_mb = 65536
gpus = 1
gpu_types = ["L4"]
workdir = "/app"

[environment.env]
# Oddish resolves this supported source from platform credentials at launch.
ORANGE_OPENAI_API_KEY = "${OPENAI_API_KEY}"

[solution.env]
# The oracle's inner assistant uses the same platform-resolved application key.
ORANGE_OPENAI_API_KEY = "${OPENAI_API_KEY}"

[verifier]
environment_mode = "separate"
network_mode = "allowlist"
allowed_hosts = ["api.openai.com"]
timeout_sec = 100800
user = "root"

[verifier.environment]
network_mode = "allowlist"
allowed_hosts = ["api.openai.com"]
build_timeout_sec = 3600
cpus = 4
memory_mb = 32768
storage_mb = 65536
gpus = 1
gpu_types = ["L4"]
workdir = "/app"

[verifier.env]
ORANGE_EVAL_QUALITY_WEIGHT = "0.8"
ORANGE_EVAL_FUNCTIONAL_WEIGHT = "0.2"
ORANGE_EVAL_ANSWER_WEIGHT = "0.9"
ORANGE_EVAL_CITATION_WEIGHT = "0.1"
ORANGE_EVAL_REQUIRED_WEIGHT = "0.8"
ORANGE_EVAL_CONDITIONAL_WEIGHT = "0.2"
ORANGE_EVAL_CITATION_MIN_ANSWER_SCORE = "0.75"
ORANGE_EVAL_QUESTION_CONCURRENCY = "10"
ORANGE_EVAL_GENERATION_CONCURRENCY = "10"
ORANGE_EVAL_GENERATION_TIMEOUT_SEC = "1800"
ORANGE_EVAL_MAX_RETRIEVAL_CALLS = "50"
ORANGE_EVAL_INGEST_TIMEOUT_SEC = "14400"
ORANGE_JUDGE_OUTPUT_RETRIES = "3"
# Keep the platform key under a verifier-specific name, separate from harness env.
ORANGE_JUDGE_API_KEY = "${OPENAI_API_KEY}"
ORANGE_OPENAI_API_KEY = "${OPENAI_API_KEY}"
