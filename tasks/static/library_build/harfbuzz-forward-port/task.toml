schema_version = "1.4"
artifacts = ["/app/harfbuzz"]

[task]
name = "abundant/swe-m2_software-engineering_harfbuzz-forward-port"
description = "Bring a frozen HarfBuzz 14.3.0 forward to the shaping, layout, metrics and API fixes of upstream's releases 14.3.1 to 15.2.0, from the release notes and the specifications."
authors = [{ name = "Neel Harsola", email = "work.neelharsola@gmail.com" }]

[metadata]
reward_type = "continuous"
open_internet_justification = "Only the image builds have public egress, to install system and Python packages and to fetch the pinned HarfBuzz 14.3.0 release and the public documents it ships with. The agent works without network access, and so does every later command in the second image."

[agent]
timeout_sec = 34560
network_mode = "no-network"
user = "dev"

[environment]
network_mode = "public"
build_timeout_sec = 3600
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
workdir = "/app"

[verifier]
environment_mode = "separate"
network_mode = "no-network"
# tests/verify.py keeps the copy, the build and every batch within 1,800 s of its start and writes the reward by
# about 2,100 s at the latest.
timeout_sec = 2400
user = "root"
env = { RELEASE = "15.2.0" }

# Runs as root in the session's container once the session has ended, before /app/harfbuzz is copied out: it ends
# every process of `dev`, round after round until none is left (a zombie does not count). `kill -9 -1` run as that
# user reaches all of them in one system call, so a process that forks cannot outrun it; pkill by effective and by
# real user catches the rest. It gives up after 60 s and exits 1, which Harbor logs.
[[verifier.collect]]
command = 'alive() { for w in -u -U; do timeout 10 pgrep "$w" dev -r R,S,D,T,t >/dev/null 2>&1; [ $? -eq 1 ] || return 0; done; return 1; }; end=$(( $(date +%s) + 60 )); while alive; do [ "$(date +%s)" -lt "$end" ] || exit 1; timeout 10 setpriv --reuid=dev --regid=dev --clear-groups kill -9 -1 >/dev/null 2>&1; timeout 10 pkill -KILL -u dev >/dev/null 2>&1; timeout 10 pkill -KILL -U dev >/dev/null 2>&1; sleep 0.1; done'
user = "root"
timeout_sec = 120

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 3600
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
