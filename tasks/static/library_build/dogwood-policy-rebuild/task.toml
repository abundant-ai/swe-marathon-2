schema_version = "1.4"
artifacts = ["/app/dogwood-rebuild"]

[task]
name = "abundant/swe-m2_software-engineering_dogwood-policy-rebuild"
description = "Reimplement, clean-room, the command-line tool of Dogwood 1.2.0, a temporal policy language for AI agents' tool calls first published in 2026, from its guide and an execute-only build."
authors = [{ name = "Neel Harsola", email = "work.neelharsola@gmail.com" }]

[metadata]
reward_type = "continuous"
open_internet_justification = "Only the image builds have public egress: they download the pinned Dogwood release, a pinned Rust toolchain and the locked crates. The agent works without network access, and so does the separate image that later builds and runs the rebuild."

[agent]
timeout_sec = 34560
network_mode = "no-network"
user = "dev"

[environment]
network_mode = "public"
build_timeout_sec = 3600
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
workdir = "/app"

[verifier]
environment_mode = "separate"
network_mode = "no-network"
timeout_sec = 4500
user = "root"

[verifier.environment]
network_mode = "public"
build_timeout_sec = 3600
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
