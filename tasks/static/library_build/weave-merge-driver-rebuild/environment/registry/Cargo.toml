# The crates the merge driver is built on, for the offline registry.
[package]
name = "registry-seed"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "lib.rs"

[dependencies]
sem-core = { version = "=0.29.0", default-features = false, features = ["lang-python", "lang-typescript", "lang-go"] }
tree-sitter = "=0.26.13"
diffy = "=0.5.2"
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.154"
serde_yaml = "=0.9.34"
toml = "=0.8.23"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
