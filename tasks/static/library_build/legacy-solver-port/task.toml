schema_version = "1.4"
multi_step_reward_strategy = "mean"
artifacts = ["/workspace/solver", "/workspace/NOTES.md"]

[task]
name = "abundant/swe-m2_scientific-computing_legacy-solver-port"
description = "Port MOPAC's PM7 method from 145k lines of Fortran 90 to Python, then add FORCE, protein-scale single points, legacy input formats, COSMO implicit solvation and solvent gradients across six dependent steps graded against the original program, whose references exist only in the verifier."
authors = [{ name = "Jack", email = "jkaisun1@gmail.com" }]
keywords = ["fortran", "legacy-code", "mopac", "semiempirical-chemistry", "multi-step", "numerical-parity", "scaling"]

[metadata]
category = "scientific-computing"
reward_type = "fraction of hidden reference cases passed, cumulative over steps 1..N with fixed denominators (mean over steps)"
tags = ["fortran", "legacy-code", "mopac", "semiempirical-chemistry", "multi-step", "numerical-parity", "scaling"]
difficulty_explanation = "Port a 145k-line Fortran code to numerically identical Python, then add FORCE with the original program's symmetry-reduced Hessian, protein-scale single points (up to about 12,000 atoms in 30 min on 8 cores) and Z-matrix/PDB input. One claude-opus-5 trial (about 10 h, 260 steps) scored 0.88 (steps 0.946, 0.855, 0.811, 0.906): it missed 8 of 32 FORCE cases (frequency errors up to 313 cm-1) and 4 of 5 hidden proteins (timeouts, with a solver that depended on a compiler). Pilots (one agent per step) took about 3.8 h in total, below the five-day target. See README.md."
solution_explanation = "Reference solution is a pure numpy/scipy PM7 solver (steps 1-2), extended with a divide-and-conquer SCF for proteins (step 3) and Z-matrix/PDB readers (step 4); steps 3 and 4 ship the same solver. Local Harbor oracle in Linux Docker: reward 1.0 on every step. See README.md."
verification_explanation = "References are MOPAC 23.2.5 outputs generated offline on Linux (Debian, gfortran, system OpenBLAS, env -i, AUX PRECISION=9) and stored under steps/*/tests/private (Git-ignored, staged into each verifier image by scripts/package_task.py); common/verifier/verify_core.py reruns the solver on every hidden case of steps 1..N with fixed denominators (hidden: 35, 32, 5, 75, 34, 34). See README.md for excluded cases and tolerances."

[agent]
timeout_sec = 28800
network_mode = "no-network"

[verifier]
environment_mode = "separate"
network_mode = "no-network"
timeout_sec = 21600
user = "root"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 900
cpus = 8
memory_mb = 16384
storage_mb = 20480
workdir = "/workspace"

[environment]
