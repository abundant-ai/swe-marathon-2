schema_version = "1.4"
artifacts = ["/app/sympy", "/var/lib/fsmaint/out"]

[task]
name = "abundant/swe-m2_scientific-computing_sympy-restoration"
description = "Write back the bodies of 2,115 functions removed from SymPy 1.14.0, without network access, so that the library again behaves as its docstrings and tests say."
authors = [{ name = "Neel Harsola", email = "work.neelharsola@gmail.com" }]

[metadata]
reward_type = "continuous"

[agent]
timeout_sec = 43200
network_mode = "no-network"
user = "dev"

[[agent.setup_begin]]
command = "/usr/local/lib/fsmaint/fsmaint-reserve"
user = "root"
timeout_sec = 120

[[agent.setup_complete]]
command = "/usr/local/lib/fsmaint/fsmaint-reserve --start-session"
user = "root"
timeout_sec = 120

[environment]
network_mode = "no-network"
build_timeout_sec = 1800
cpus = 4
memory_mb = 16384
storage_mb = 20480
gpus = 0
workdir = "/app"

[verifier]
environment_mode = "separate"
network_mode = "no-network"
timeout_sec = 6600
user = "root"

[[verifier.collect]]
command = "/usr/local/lib/fsmaint/fsmaint-sweep"
user = "root"
timeout_sec = 600

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 1800
cpus = 4
memory_mb = 16384
storage_mb = 20480
gpus = 0
