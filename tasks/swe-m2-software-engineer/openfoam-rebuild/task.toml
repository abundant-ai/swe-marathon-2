schema_version = "1.4"
multi_step_reward_strategy = "final"
artifacts = ["/app/rebuild"]

[task]
name = "abundant/swe-m2_software-engineering_openfoam-rebuild"
description = "Rebuild OpenFOAM v2606's command-line programs clean-room, matching the installed programs' files, output and exit codes on recorded runs."
authors = [{ name = "Adnan El Assadi", email = "adnanelassadi@cmail.carleton.ca" }]

[metadata]
reward_type = "continuous"

[agent]
timeout_sec = 43200
user = "dev"

[environment]
network_mode = "no-network"
build_timeout_sec = 10800
cpus = 16
memory_mb = 32768
storage_mb = 102400
gpus = 0
workdir = "/app"

[verifier]
environment_mode = "separate"
network_mode = "no-network"
timeout_sec = 21600
user = "root"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 10800
cpus = 16
memory_mb = 65536
storage_mb = 204800
gpus = 0
workdir = "/app"

[[steps]]
name = "01-rebuild-openfoam"

[steps.agent]
timeout_sec = 43200

# Harbor's step verifier defaults to 600 seconds instead of inheriting the root limit.
[steps.verifier]
timeout_sec = 21600
