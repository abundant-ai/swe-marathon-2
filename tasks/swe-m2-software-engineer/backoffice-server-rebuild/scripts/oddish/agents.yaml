# Model trials, only after the baselines of the same task version are green.
agents:
  - name: claude-code
    model_name: relace/deepseek-v4.1-flash
    n_trials: 1
    env:
      CLAUDE_CODE_AUTO_COMPACT_WINDOW: "300000"
    kwargs:
      # no apostrophes or quotes here: with a non-root agent user the harness passes this through a shell
      append_system_prompt: "No one will answer questions or check in. Keep going until everything requested is finished and verified, however long that takes. Do not pause to report progress, to summarise, or to wait for helper agents. Ending your turn ends your work."
max_trial_attempts: 1
