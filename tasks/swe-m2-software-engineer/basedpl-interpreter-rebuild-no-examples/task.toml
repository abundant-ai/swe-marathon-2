schema_version = "1.4"
multi_step_reward_strategy = "final"
artifacts = ["/app/rebuild"]

[task]
name = "abundant/swe-m2_software-engineering_basedpl-interpreter-rebuild-no-examples"
description = "Reimplement the interpreter of an array language first published in late 2026 from an execute-only copy of the interpreter and its documentation alone, with no example runs or recorded outputs."
authors = [{ name = "Neel Harsola", email = "work.neelharsola@gmail.com" }]

[metadata]
reward_type = "continuous"
open_internet_justification = "Only the image builds have public egress, to install system packages from Ubuntu's archive. The agent works without network access."

[agent]
# The session ends at 33,900 s, when a root timer (environment/session-timer) ends the session user's processes;
# this limit is a backstop 60 s later. The reason: trials that reached the platform's own cap with this kind of
# verifier image (a separate one, built after the session) got no verifier result, so the session ends before it.
timeout_sec = 33960
network_mode = "no-network"
user = "dev"

[[agent.setup_begin]]
command = "/usr/local/sbin/provision-scratch"
timeout_sec = 120

[[agent.setup_complete]]
command = "/usr/local/sbin/provision-scratch"
timeout_sec = 120

[[agent.setup_complete]]
command = "/usr/local/sbin/session-timer"
user = "root"
timeout_sec = 60

[environment]
network_mode = "public"
build_timeout_sec = 3600
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
workdir = "/app"

[verifier]
environment_mode = "separate"
network_mode = "no-network"
timeout_sec = 4500
user = "root"

[[verifier.collect]]
command = "/usr/local/sbin/reclaim-scratch"
user = "root"
timeout_sec = 600

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 3600
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0

[[steps]]
name = "01-rebuild-interpreter"

[steps.agent]
# The session ends at 33,900 s, when a root timer (environment/session-timer) ends the session user's processes;
# this limit is a backstop 60 s later. The reason: trials that reached the platform's own cap with this kind of
# verifier image (a separate one, built after the session) got no verifier result, so the session ends before it.
timeout_sec = 33960

[steps.verifier]
timeout_sec = 4500
