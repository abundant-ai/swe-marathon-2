schema_version = "1.4"
multi_step_reward_strategy = "final"
artifacts = ["/app/rebuild"]

[task]
name = "abundant/swe-m2_software-engineering_basedpl-rebuild"
description = "Reimplement the interpreter of an array language first published in late 2026 from an execute-only copy of the interpreter and its documentation alone, with no example runs or recorded outputs."
authors = [{ name = "Neel Harsola", email = "work.neelharsola@gmail.com" }]

[metadata]
reward_type = "continuous"
open_internet_justification = "Only the image builds have public egress, to install system packages from Ubuntu's archive. The agent works without network access."

[agent]
timeout_sec = 34560
network_mode = "no-network"
user = "dev"

[environment]
network_mode = "public"
build_timeout_sec = 3600
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
workdir = "/app"

[verifier]
environment_mode = "separate"
network_mode = "no-network"
timeout_sec = 3600
user = "root"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 3600
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0

[[steps]]
name = "01-rebuild-interpreter"

[steps.agent]
timeout_sec = 34560

[steps.verifier]
timeout_sec = 3600
