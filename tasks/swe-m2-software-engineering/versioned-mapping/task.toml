schema_version = "1.4"
multi_step_reward_strategy = "final"
artifacts = ["/app/versioned_mapping"]

[task]
name = "abundant/swe-m2_software-engineering_versioned-mapping"
description = "Build a lidar mapping tool that registers new visits, reconciles occupancy evidence and releases immutable map versions."
authors = [{ name = "QingyuanWuNothing", email = "qingyuanwu4work@gmail.com" }]

[metadata]
reward_type = "continuous"

[agent]
timeout_sec = 5400
user = "candidate"
network_mode = "no-network"

[environment]
network_mode = "no-network"
build_timeout_sec = 600
cpus = 2
memory_mb = 2048
storage_mb = 4096
workdir = "/app"

[verifier]
environment_mode = "separate"
network_mode = "no-network"
timeout_sec = 600
user = "root"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 600
cpus = 2
memory_mb = 2048
storage_mb = 4096
workdir = "/app"

[[steps]]
name = "01-build-map"

[[steps]]
name = "02-register-visits"

[[steps]]
name = "03-reconcile-evidence"

[[steps]]
name = "04-release-maps"

[[steps]]
name = "05-qualify-release"
