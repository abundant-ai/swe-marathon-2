schema_version = "1.4"
multi_step_reward_strategy = "final"
artifacts = ["/app/dual_arm"]

[task]
name = "abundant/swe-m2_software-engineering_dual-arm-handoff"
description = "Certify three-dimensional dual-arm motion, recover interrupted transfers, and plan under partial fixture visibility and start delays."
authors = [{ name = "QingyuanWuNothing", email = "qingyuanwu4work@gmail.com" }]

[metadata]
reward_type = "continuous"

[agent]
timeout_sec = 5400
user = "candidate"
network_mode = "no-network"

[environment]
network_mode = "allowlist"
allowed_hosts = ["pypi.org", "files.pythonhosted.org"]
build_timeout_sec = 600
cpus = 2
memory_mb = 2048
storage_mb = 4096
workdir = "/app"

[verifier]
environment_mode = "separate"
network_mode = "no-network"
timeout_sec = 600
user = "root"

[verifier.environment]
network_mode = "allowlist"
allowed_hosts = ["pypi.org", "files.pythonhosted.org"]
build_timeout_sec = 600
cpus = 2
memory_mb = 2048
storage_mb = 4096
workdir = "/app"

[[steps]]
name = "01-certify-spatial-motion"

[[steps]]
name = "02-plan-handoff"

[[steps]]
name = "03-recover-transfer"

[[steps]]
name = "04-plan-with-partial-visibility"


[[steps]]
name = "05-commission-native-arms"

[[steps]]
name = "06-synthesize-native-transfer"

[[steps]]
name = "07-execute-revised-native-transfer"
