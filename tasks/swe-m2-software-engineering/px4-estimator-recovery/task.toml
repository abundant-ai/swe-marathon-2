schema_version = "1.4"
multi_step_reward_strategy = "final"
artifacts = ["/app/px4_recovery"]

[task]
name = "abundant/swe-m2_software-engineering_px4-estimator-recovery"
description = "Reconcile PX4-style reset counters and supervise software-only missions through redundant estimator and inertial faults."
authors = [{ name = "Qingyuan Wu", email = "qingyuanwu4work@gmail.com" }]

[metadata]
reward_type = "continuous"

[agent]
timeout_sec = 3600
user = "candidate"
network_mode = "no-network"

[environment]
network_mode = "allowlist"
allowed_hosts = ["deb.debian.org", "raw.githubusercontent.com", "nodejs.org", "registry.npmjs.org", "pypi.org", "files.pythonhosted.org"]
build_timeout_sec = 600
cpus = 2
memory_mb = 1536
storage_mb = 4096
workdir = "/app"

[verifier]
environment_mode = "separate"
network_mode = "no-network"
timeout_sec = 480
user = "root"

[verifier.environment]
network_mode = "allowlist"
allowed_hosts = ["pypi.org", "files.pythonhosted.org"]
build_timeout_sec = 600
cpus = 2
memory_mb = 1024
storage_mb = 4096
workdir = "/app"

[[steps]]
name = "01-reconcile-estimator"

[[steps]]
name = "02-follow-mission"

[[steps]]
name = "03-recover-navigation"

[[steps]]
name = "04-supervise-redundant-estimators"

[[steps]]
name = "05-commission-inertial-timing"

[[steps]]
name = "06-fly-with-delayed-aiding"

[[steps]]
name = "07-land-with-degraded-aiding"

[[steps]]
name = "08-land-on-moving-cart"

[[steps]]
name = "09-land-from-onboard-aiding"
