schema_version = "1.4"
multi_step_reward_strategy = "final"
artifacts = ["/app/fleet_recovery"]

[task]
name = "abundant/swe-m2_software-engineering_fleet-recovery"
description = "Develop a mixed-fleet delivery coordinator that keeps shared passages safe through closures, parcel cancellation and coordinator restart."
authors = [{ name = "Qingyuan Wu", email = "qingyuanwu4work@gmail.com" }]

[metadata]
reward_type = "continuous"

[agent]
timeout_sec = 5400
user = "candidate"
network_mode = "no-network"

[environment]
network_mode = "allowlist"
allowed_hosts = ["archive.ubuntu.com", "security.ubuntu.com", "deb.debian.org", "raw.githubusercontent.com", "nodejs.org", "registry.npmjs.org", "pypi.org", "files.pythonhosted.org"]
build_timeout_sec = 600
cpus = 2
memory_mb = 2048
storage_mb = 4096
workdir = "/app"

[verifier]
environment_mode = "separate"
network_mode = "no-network"
timeout_sec = 600
user = "root"

[verifier.environment]
network_mode = "allowlist"
allowed_hosts = ["archive.ubuntu.com", "security.ubuntu.com"]
build_timeout_sec = 600
cpus = 2
memory_mb = 2048
storage_mb = 4096
workdir = "/app"

[[steps]]
name = "01-dispatch"

[[steps]]
name = "02-blockages"

[[steps]]
name = "03-reconnect"

[[steps]]
name = "04-schedule-elevators"

[[steps]]
name = "05-reserve-lift-corridors"

[[steps]]
name = "06-route-energy-constrained-fleet"

[[steps]]
name = "07-reconcile-native-traffic"

[[steps]]
name = "08-negotiate-competing-traffic"

[[steps]]
name = "09-commit-contingent-traffic"
