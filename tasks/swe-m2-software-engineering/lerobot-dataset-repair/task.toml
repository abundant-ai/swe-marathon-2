schema_version = "1.4"
multi_step_reward_strategy = "final"
artifacts = ["/app/lerobot_repair"]

[task]
name = "abundant/swe-m2_software-engineering_lerobot-dataset-repair"
description = "Audit and repair native LeRobotDataset v3 recordings with frame evidence and drifting camera clocks, then publish a clean version atomically."
authors = [{ name = "QingyuanWuNothing", email = "qingyuanwu4work@gmail.com" }]

[metadata]
reward_type = "continuous"

[agent]
timeout_sec = 5400
user = "candidate"
network_mode = "no-network"

[environment]
network_mode = "allowlist"
allowed_hosts = ["pypi.org", "files.pythonhosted.org"]
build_timeout_sec = 600
cpus = 2
memory_mb = 2048
storage_mb = 4096
workdir = "/app"

[verifier]
environment_mode = "separate"
network_mode = "no-network"
timeout_sec = 600
user = "root"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 600
cpus = 2
memory_mb = 2048
storage_mb = 4096
workdir = "/app"

[[steps]]
name = "01-audit-dataset"

[[steps]]
name = "02-plan-repair"

[[steps]]
name = "03-publish-repair"


[[steps]]
name = "04-recover-capture-clocks"

[[steps]]
name = "05-qualify-actuation"

[[steps]]
name = "06-reconstruct-global-actions"
