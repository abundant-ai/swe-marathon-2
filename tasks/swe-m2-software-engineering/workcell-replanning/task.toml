schema_version = "1.4"
multi_step_reward_strategy = "final"
artifacts = ["/app/workcell"]

[task]
name = "abundant/swe-m2_software-engineering_workcell-replanning"
description = "Recover a loaded robot in a moving workcell and safely dispatch motion across forecast changes and restarts."
authors = [{ name = "QingyuanWuNothing", email = "qingyuanwu4work@gmail.com" }]

[metadata]
reward_type = "continuous"

[agent]
timeout_sec = 5400
user = "candidate"
network_mode = "no-network"

[environment]
network_mode = "no-network"
build_timeout_sec = 600
cpus = 2
memory_mb = 2048
storage_mb = 4096
workdir = "/app"

[verifier]
environment_mode = "separate"
network_mode = "no-network"
timeout_sec = 600
user = "root"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 600
cpus = 2
memory_mb = 2048
storage_mb = 4096
workdir = "/app"

[[steps]]
name = "01-reconcile-scene"

[[steps]]
name = "02-certify-motion"

[[steps]]
name = "03-recover-motion"

[[steps]]
name = "04-plan-in-time"

[[steps]]
name = "05-dispatch-motion"
