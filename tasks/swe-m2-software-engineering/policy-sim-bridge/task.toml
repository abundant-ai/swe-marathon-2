schema_version = "1.4"
multi_step_reward_strategy = "final"
artifacts = ["/app/policy_bridge"]

[task]
name = "abundant/swe-m2_software-engineering_policy-sim-bridge"
description = "Rebuild a frozen robotics policy's observation and actuation interface across simulator exports, recover timed sessions and report their first divergence."
authors = [{ name = "Qingyuan Wu", email = "qingyuanwu4work@gmail.com" }]

[metadata]
reward_type = "continuous"

[agent]
timeout_sec = 3600
user = "candidate"
network_mode = "no-network"

[environment]
network_mode = "allowlist"
allowed_hosts = ["deb.debian.org", "raw.githubusercontent.com", "nodejs.org", "registry.npmjs.org", "pypi.org", "files.pythonhosted.org"]
build_timeout_sec = 600
cpus = 2
memory_mb = 2048
storage_mb = 4096
workdir = "/app"

[verifier]
environment_mode = "separate"
network_mode = "no-network"
timeout_sec = 420
user = "root"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 600
cpus = 2
memory_mb = 1536
storage_mb = 4096
workdir = "/app"

[[steps]]
name = "01-rebuild-observations"

[[steps]]
name = "02-run-frozen-policy"

[[steps]]
name = "03-guard-and-restart"

[[steps]]
name = "04-compare-exports"

[[steps]]
name = "05-commission-backend"

[[steps]]
name = "06-stabilize-deployment"

[[steps]]
name = "07-supervise-free-base-locomotion"

[[steps]]
name = "08-route-a-live-go2-course"

[[steps]]
name = "09-register-live-range-scans"
