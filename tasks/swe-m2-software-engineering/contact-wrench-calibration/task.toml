schema_version = "1.4"
multi_step_reward_strategy = "final"
artifacts = ["/app/wrenchlab"]

[task]
name = "abundant/swe-m2_software-engineering_contact-wrench-calibration"
description = "Calibrate contact wrenches and predict held-out pushes."
authors = [{ name = "QingyuanWuNothing", email = "qingyuanwu4work@gmail.com" }]

[metadata]
reward_type = "continuous"

[agent]
timeout_sec = 5400
user = "candidate"
network_mode = "no-network"

[environment]
network_mode = "allowlist"
allowed_hosts = ["pypi.org", "files.pythonhosted.org"]
build_timeout_sec = 900
cpus = 2
memory_mb = 2048
storage_mb = 4096
workdir = "/app"

[verifier]
environment_mode = "separate"
network_mode = "no-network"
timeout_sec = 600
user = "root"

[verifier.environment]
network_mode = "allowlist"
allowed_hosts = ["pypi.org", "files.pythonhosted.org"]
build_timeout_sec = 900
cpus = 2
memory_mb = 2048
storage_mb = 4096
workdir = "/app"


[[steps]]
name = "01-transform-wrenches"

[[steps]]
name = "02-calibrate-sensor"

[[steps]]
name = "03-qualify-contact"
