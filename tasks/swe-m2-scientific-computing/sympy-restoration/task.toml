schema_version = "1.4"
multi_step_reward_strategy = "final"
artifacts = ["/app/sympy", "/var/lib/fsmaint/out"]

[task]
name = "abundant/swe-m2_scientific-computing_sympy-restoration"
description = "Write back the bodies of 2,114 functions removed from SymPy 1.14.0, without network access, so that the library again behaves as its docstrings and tests say."
authors = [{ name = "Neel Harsola", email = "work.neelharsola@gmail.com" }]

[metadata]
reward_type = "continuous"
open_internet_justification = "Both images are built with public egress, to install their system packages and Python packages, and the agent's set-up has it too, to install the agent's tooling. The work itself, and the commands run in the second image after it, run without network access."

[agent]
timeout_sec = 34560
network_mode = "no-network"
user = "dev"

[[agent.setup_begin]]
command = "/usr/local/lib/fsmaint/fsmaint-reserve"
user = "root"
timeout_sec = 120

[[agent.setup_complete]]
command = "/usr/local/lib/fsmaint/fsmaint-reserve --netcheck"
user = "root"
timeout_sec = 120

[environment]
network_mode = "public"
build_timeout_sec = 1800
cpus = 4
memory_mb = 16384
storage_mb = 20480
gpus = 0
workdir = "/app"

[verifier]
environment_mode = "separate"
network_mode = "no-network"
timeout_sec = 6600
user = "root"

[[verifier.collect]]
command = "/usr/local/lib/fsmaint/fsmaint-sweep"
user = "root"
timeout_sec = 600

[verifier.environment]
network_mode = "public"
build_timeout_sec = 1800
cpus = 4
memory_mb = 16384
storage_mb = 20480
gpus = 0

[[steps]]
name = "01-restore-bodies"

[steps.agent]
timeout_sec = 34560

[steps.verifier]
timeout_sec = 6600
