schema_version = "1.4"
multi_step_reward_strategy = "final"
artifacts = ["/app/sympy"]

[task]
name = "abundant/swe-m2_scientific-computing_sympy-restoration"
description = "Write back the bodies of 2,671 functions removed from SymPy 1.14.0, without network access, so that the library again behaves as its docstrings and tests say."
authors = [{ name = "Neel Harsola", email = "work.neelharsola@gmail.com" }]

[metadata]
reward_type = "binary"
open_internet_justification = "The environment build and agent setup have public egress, to install system packages, Python packages and the agent's own tooling. The work runs with network_mode = no-network as the unprivileged user dev, and a root collect step stops every process of dev and records every file's times before the work is copied. The verifier runs with no network."

[agent]
timeout_sec = 34560
network_mode = "no-network"
user = "dev"

[[agent.setup_begin]]
command = "/usr/local/lib/fsmaint/fsmaint-reserve"
user = "root"
timeout_sec = 120

[[agent.setup_complete]]
command = "/usr/local/lib/fsmaint/fsmaint-reserve --netcheck"
user = "root"
timeout_sec = 120

[environment]
network_mode = "public"
build_timeout_sec = 1800
cpus = 4
memory_mb = 16384
storage_mb = 20480
gpus = 0
workdir = "/app"

[verifier]
environment_mode = "separate"
network_mode = "no-network"
timeout_sec = 6600
user = "root"

[[verifier.collect]]
command = "/usr/local/lib/fsmaint/fsmaint-sweep"
user = "root"
timeout_sec = 600

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 1800
cpus = 4
memory_mb = 16384
storage_mb = 20480
gpus = 0

[[steps]]
name = "01-restore-bodies"

[steps.agent]
timeout_sec = 34560

# Without this, the step verifier defaults to 600 seconds instead of the root limit.
[steps.verifier]
timeout_sec = 6600
