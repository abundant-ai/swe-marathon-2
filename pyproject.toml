[project]
name = "swe-marathon-2"
version = "0.1.0"
description = "Local tools for authoring, packaging, and validating SWE-Marathon tasks."
requires-python = ">=3.13,<3.14"
dependencies = ["orange-task-authoring"]

[tool.uv]
package = false

[tool.uv.sources]
orange-task-authoring = { path = "tasks/static/app_building/knowledge-work-assistant", package = false }
abundant-titans = { git = "https://github.com/abundant-ai/titans.git", rev = "2260f95668a4c3d40fd6050292a1d2f74d8f5a5c" }

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.17.6"]
# Optional training dependencies; opt in with --group titans.
titans = ["abundant-titans"]
titans-data = ["pyarrow==23.0.1"]

[tool.pytest.ini_options]
testpaths = [
    "tasks/static/app_building/knowledge-work-assistant/checks",
    "tasks/static/robotics/dual-arm-handoff/checks",
    "tasks/static/robotics/fixed-lag-fusion/checks",
    "tasks/static/library_build/sympy-restoration/checks",
    "tasks/static/app_clone/backoffice-server-rebuild/checks",
    "tasks/static/app_clone/goose-compiler-rebuild/checks",
    "tasks/static/app_clone/carve-html-renderer-from-spec-only/checks",
    "tasks/static/app_clone/basedpl-interpreter-rebuild-no-examples/checks",
    "tasks/static/app_clone/openfoam-rebuild/checks",
]
