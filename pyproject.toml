[project]
name = "swe-marathon-2"
version = "0.1.0"
description = "Local tools for authoring, packaging, and validating SWE-Marathon tasks."
requires-python = ">=3.13,<3.14"
dependencies = [
    "pyarrow==23.0.1",
    "logfire>=4,<5",
    "pydantic==2.14.3",
    "harbor[modal] @ git+https://github.com/harbor-framework/harbor.git@feea734de84bf2479b329dc6315a6d98d1596f4f",
    "modal==1.6.4",
    "chromadb==1.5.9",
    "opentelemetry-instrumentation-fastapi==0.65b0",
    "pydantic-ai-slim[openai]==2.68.0",
    "openai==3.49.0",
    "safetensors==0.8.0",
    "numpy==2.5.4",
    "thunder-sandbox==0.8.4",
]

[tool.uv]
package = false

[tool.uv.sources]
abundant-titans = { git = "https://github.com/abundant-ai/titans.git", rev = "2260f95668a4c3d40fd6050292a1d2f74d8f5a5c" }

[dependency-groups]
dev = [
    "flatbuffers==25.9.23",
    "jax==0.8.0",
    "pygame==2.6.1",
    "pytest==8.4.2",
    "ruff==0.17.6",
]
# Optional training dependencies; opt in with --group titans.
titans = ["abundant-titans"]
titans-data = ["pyarrow==23.0.1"]
