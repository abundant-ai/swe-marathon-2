[project]
name = "swe-marathon-2"
version = "0.1.0"
description = "Local tools for authoring, packaging, and validating SWE-Marathon tasks."
requires-python = ">=3.13,<3.14"
dependencies = ["orange-task-authoring"]

[tool.uv]
package = false

[tool.uv.sources]
orange-task-authoring = { path = "tasks/swe-m2-ai-engineer/knowledge-work-assistant", package = false }
abundant-titans = { git = "https://github.com/abundant-ai/titans.git", rev = "2260f95668a4c3d40fd6050292a1d2f74d8f5a5c" }

[dependency-groups]
dev = ["av==16.1.0", "pyarrow==23.0.1", "pytest==8.4.2"]
# Optional training dependencies; opt in with --group titans.
titans = ["abundant-titans"]
titans-data = ["pyarrow==23.0.1"]

[tool.pytest.ini_options]
testpaths = [
    "ci_checks",
    "tasks/swe-m2-ai-engineer/knowledge-work-assistant/checks",
    "tasks/swe-m2-software-engineering/policy-sim-bridge/checks",
    "tasks/swe-m2-software-engineering/fixed-lag-fusion/checks",
    "tasks/swe-m2-software-engineering/px4-estimator-recovery/checks",
    "tasks/swe-m2-software-engineering/dual-arm-handoff/checks",
    "tasks/swe-m2-software-engineering/lerobot-dataset-repair/checks",
    "tasks/swe-m2-software-engineering/ros2-control-recovery/checks",
    "tasks/swe-m2-software-engineering/fleet-recovery/checks",
    "tasks/swe-m2-software-engineering/nav2-docking-recovery/checks",
    "tasks/swe-m2-software-engineering/mujoco-branch-replay/checks",
    "tasks/swe-m2-software-engineering/versioned-mapping/checks",
]
