name: Static checks

on:
  pull_request:
  push:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: V2 structure and CI regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          python-version: "3.13"
      - name: Check repository sources and declared v2 tasks
        run: uv run --no-project python ci_checks/check_repository.py
      - name: Test CI failure handling
        run: uv run --no-project python -m unittest discover -s ci_checks -v
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"
          cache: false
      - name: Validate GitHub Actions syntax and shell commands
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          shellcheck --version
          "$(go env GOPATH)/bin/actionlint" -color
