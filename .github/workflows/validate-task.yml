name: Task validation

on:
  pull_request:
  push:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  author-checks:
    name: Author tests and package round trip
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANONYMIZED_TELEMETRY: "False"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          python-version: "3.13"
      - name: Install Python before offline validation
        run: uv python install 3.13
      - name: Install the shared development environment
        run: |
          uv lock --check --offline
          uv sync --frozen
      - name: Check out the pinned public HERB inputs
        uses: actions/checkout@v4
        with:
          repository: SalesforceAIResearch/HERB
          ref: db3bf9b3f911745726c579c9dbf9f7f6b2c05b36
          path: HERB
          persist-credentials: false
      - name: Prepare the actual packaging test inputs
        run: uv run --frozen python tasks/swe-m2-ai-engineer/knowledge-work-assistant/scripts/prepare_data.py --herb HERB
      - name: Run all author and CI regression tests
        run: |
          rm -f ci-results/pytest.xml
          uv run --frozen pytest -q --junitxml=ci-results/pytest.xml
      - name: Require executed tests with no skips
        if: always()
        run: uv run --no-project python ci_checks/check_test_results.py ci-results/pytest.xml
      - name: Save test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: author-test-results
          path: ci-results/pytest.xml
          if-no-files-found: error
          retention-days: 14
